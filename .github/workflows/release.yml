name: Release Launcher

# Dispara ao empurrar uma tag "vX.Y.Z" (ex.: v2.0.0). Nao ha compilacao —
# o launcher .bat so aponta pro Gist, que sempre serve a versao mais recente
# do ServiceDeskTool.ps1.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: Elgin-Service-Desk-Tool.bat
          generate_release_notes: true
